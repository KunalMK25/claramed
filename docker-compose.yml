version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: claramed_postgres
    environment:
      POSTGRES_DB: claramed
      POSTGRES_USER: claramed
      POSTGRES_PASSWORD: claramed_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claramed"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: claramed_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claramed_backend
    command: sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://claramed:claramed_dev_password@postgres:5432/claramed
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/storage
      RADIOLOGY_MODEL_CACHE_DIR: /app/models/cache
      TESSERACT_CMD: tesseract
    volumes:
      - ./storage:/app/storage
      - ./models/cache:/app/models/cache
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claramed_worker
    command: celery -A backend.workers.celery_app worker --loglevel=info
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://claramed:claramed_dev_password@postgres:5432/claramed
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/storage
      RADIOLOGY_MODEL_CACHE_DIR: /app/models/cache
      TESSERACT_CMD: tesseract
    volumes:
      - ./storage:/app/storage
      - ./models/cache:/app/models/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: claramed_frontend
    environment:
      BACKEND_URL: http://backend:8000
      STREAMLIT_SERVER_PORT: 8501
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
